name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
   name: Build and Release 1.12.x

on:
  push:
    tags: 'v*'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v1
      
      - name: Set up JDK 1.8
        id: set_up_jdk
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
      
      - name: Build
        run: ./gradlew build
        env:
          VERSION:  ${{ steps.get_version.outputs.result }}
      
      - name: Copy together artifacts
        shell: bash
        run: |
          mkdir dist
          cp build/libs/*.jar dist

      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: dist/*

          
